name: PR Review Trigger
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  trigger-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Trigger OpenClaw Review
        env:
          WEBHOOK_URL: ${{ secrets.OPENCLAW_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}
        run: |
          curl -sf -X POST "${WEBHOOK_URL}/hooks/agent" \
            -H "Authorization: Bearer ${WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "message": "Review PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.html_url }}

Title: ${{ github.event.pull_request.title }}
Author: ${{ github.event.pull_request.user.login }}
Action: ${{ github.event.action }}
Base: ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}

Description:
${{ github.event.pull_request.body }}",
            "agentId": "dev-reviewer",
            "model": "anthropic/claude-opus-4-7",
            "thinking": "high"
          }
          EOF
